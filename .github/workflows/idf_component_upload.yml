# Based on: https://docs.espressif.com/projects/idf-component-manager/en/latest/publish/how_to_github_actions_upload.html
# Using "Option 1: OIDC authentication (recommended)"
# When you add the "trusted uploader", the Repository is the GitHub repo.
# The capitalization needs to follow the true repo name, not the all-lower-case format of the
# IDF namespace and components:
# REPOSITORY: sparkfun/SparkFun_u-blox_GNSS_v4
# WORKFLOW:   idf_component_upload.yml
# BRANCH:     main

name: Upload to IDF Component Registry

on:
  workflow_dispatch:
    branches:
      - main
  release:
    types:
      - published

jobs:
  upload_components:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        run: |
          echo "currentVersion=$(grep -Po "(?<=version=)([0-9]).([0-9]).([0-9])" ./library.properties)" >> "$GITHUB_ENV"

      - name: Upload components
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "sparkfun_u-blox_gnss_v4: ."
          version: ${{ env.currentVersion }}
          namespace: "sparkfun"

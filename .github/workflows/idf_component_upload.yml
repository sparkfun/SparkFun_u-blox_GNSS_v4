name: Upload to IDF Component Registry
on:
  workflow_dispatch:
    branches:
      - main
  release:
    types:
      - published

jobs:
  upload_components:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        run: |
          echo "currentVersion=$(grep -Po "(?<=version=)([0-9]).([0-9]).([0-9])" ./library.properties)" >> "$GITHUB_ENV"

      - name: Upload components
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "sparkfun_u-blox_gnss_v4: ."
          version: ${{ env.currentVersion }}
          namespace: "sparkfun"
